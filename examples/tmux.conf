# Suggested ~/.tmux.conf additions for the control room. Reload: tmux source-file ~/.tmux.conf

# Mouse on: the wheel (desktop) and a swipe (phone, via the UI's touch→wheel bridge) scroll
# the history directly, no Ctrl-b [ needed.
set -g mouse on
# Every pane keeps its history in RAM; with several sessions 50k lines each adds up fast.
set -g history-limit 8000
# The window follows the most recently active client, not the smallest one. Opening the same
# session on your phone won't leave the desktop with a blank strip afterwards.
set -g window-size latest

# Wheel up: pass it through to full-screen apps (vim/less) and panes already in a mode;
# otherwise enter copy-mode with -e (it exits by itself when you scroll back to the bottom).
bind -n WheelUpPane if-shell -F -t= "#{?pane_in_mode,1,#{alternate_on}}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -T copy-mode    WheelUpPane   send-keys -X -N 3 scroll-up
bind -T copy-mode    WheelDownPane send-keys -X -N 3 scroll-down
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# Copy to the DEVICE clipboard: tmux emits OSC 52 and the UI's bridge writes it to the
# clipboard of whatever browser you're on.
set -g set-clipboard on
set -g allow-passthrough on
# Releasing a drag copies but stays in copy-mode with the selection visible (the default
# copy-and-cancel exits instantly). Escape or q to leave.
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Right click: DON'T open tmux's context menu. It has a "Kill" item, and since every session
# is a single pane, one accidental tap killed a Claude session. The browser's own menu still works.
bind -n MouseDown3Pane if-shell -F -t = "#{mouse_any_flag}" "select-pane -t = ; send-keys -M" ""
unbind -n MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3Pane
unbind -n M-MouseDown3Status
unbind -n M-MouseDown3StatusLeft

# The UI's 🧹 button sends F12: clear this session's scrollback (frees memory).
bind -n F12 clear-history
bind -T copy-mode    F12 send-keys -X cancel \; clear-history
bind -T copy-mode-vi F12 send-keys -X cancel \; clear-history
