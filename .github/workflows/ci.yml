name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax + shellcheck
        run: |
          files="install.sh start.sh bin/cr-clip bin/cr-expose bin/cr-session bin/cr-cc bin/cr-exclusive bin/cr-hist bin/cr-notes bin/skill-new bin/slog tests/run.sh .devcontainer/setup.sh .devcontainer/start-bg.sh"
          for f in $files; do bash -n "$f"; done
          shellcheck --severity=error $files
      - name: python compiles
        run: python3 -m py_compile server/server.py server/chat.py hooks/cr-statusline.py hooks/cr-state-hook.py hooks/cr-guard-hook.py hooks/cr-context-hook.py hooks/cr-history-hook.py bin/skill-lint
      - name: skill-lint on the bundled skills
        run: python3 bin/skill-lint skills

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux ttyd graphviz libjs-katex
      - name: install.sh
        run: bash install.sh --workdir "$PWD"
      - name: start the panel and hit it
        run: |
          export CR_STATE_DIR="$RUNNER_TEMP/cr"
          ./start.sh > "$RUNNER_TEMP/cr.log" 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:7680/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:7680/ | grep -q '<html'                       # the UI
          curl -fsS -o /dev/null "http://127.0.0.1:7680/tty/?arg=shell"             # ttyd through the proxy
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:7680/dl?p=/etc/passwd")
          [ "$code" != 200 ] || { echo "file browser served a path outside CR_FILE_ROOTS"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:7680/view?p=/etc/passwd")
          [ "$code" != 200 ] || { echo "viewer served a path outside CR_FILE_ROOTS"; exit 1; }
          curl -fsS -o chat.js.out  http://127.0.0.1:7680/chat.js  && grep -q 'pollChat' chat.js.out   # the Chat view
          curl -fsS -o chat.css.out http://127.0.0.1:7680/chat.css && grep -q 'cperm' chat.css.out
          curl -fsS "http://127.0.0.1:7680/api/chat?s=shell" | python3 -c 'import json,sys; json.load(sys.stdin)'
          curl -fsS http://127.0.0.1:7680/api/usage | python3 -c 'import json,sys; json.load(sys.stdin)'
          # formulas and diagrams (optional deps, installed above): served locally, nothing outside the KaTeX dir
          curl -fsS -o /dev/null http://127.0.0.1:7680/katex/katex.min.js
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:7680/katex/..%2F..%2F..%2F..%2Fetc%2Fpasswd")
          [ "$code" = 404 ] || { echo "/katex served a path outside its folder"; exit 1; }
          g=$(printf 'digraph{a->b}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          curl -fsS "http://127.0.0.1:7680/dot?e=dot&g=$g" | grep -q '<svg'
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:7680/dot?e=dot&g=bm90IGRvdA")
          [ "$code" = 422 ] || { echo "/dot accepted something that isn't DOT"; exit 1; }
          # a large attachment in pieces: a damaged piece is refused, the good ones reassemble byte for byte
          head -c 3000000 /dev/urandom > big.bin; split -b 1000000 -d big.bin pz.
          bad=$(curl -s -F "f=@pz.00;filename=big.zip" -F up=smoke0bad -F ui=0 -F un=3 -F sha="$(printf '0%.0s' $(seq 64))" -F sz=3000000 -F s=shell http://127.0.0.1:7680/chat/send)
          grep -q 'SHA-256 mismatch' <<<"$bad"
          i=0; for f in pz.*; do out=$(curl -fsS -F "f=@$f;filename=big.zip" -F up=smoke0good -F ui=$i -F un=3 -F sha="$(sha256sum "$f" | cut -c1-64)" -F sz=3000000 -F s=shell http://127.0.0.1:7680/chat/send); i=$((i+1)); done
          got=$(grep -o "data-path='[^']*'" <<<"$out" | cut -d"'" -f2)
          cmp big.bin "$got"
          cat "$RUNNER_TEMP/cr.log"
      - name: slog locks (hierarchical conflict)
        run: |
          export SLOG_BOARD="$RUNNER_TEMP/board/SESSIONS.md"
          SLOG_TAG=alice bin/slog take "api:auth"
          SLOG_TAG=bob   bin/slog take "api:billing"
          SLOG_TAG=bob   bin/slog take api 2>&1 | tee out.txt
          grep -qi 'overlap\|conflict\|held' out.txt
          bin/slog locks
      - name: behavior tests (lock guard, context hook, notes, exclusive, history, permission badge, chat view)
        run: bash tests/run.sh
