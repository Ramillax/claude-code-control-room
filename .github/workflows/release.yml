name: Release

# Push a tag like v1.1.0 and this publishes a GitHub Release with auto-generated notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# A tag push can be delivered twice (v1.3.13 got two runs one second apart and the second failed with
# "release already exists"). One run per tag at a time, and an existing release counts as done.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, nothing to do."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
